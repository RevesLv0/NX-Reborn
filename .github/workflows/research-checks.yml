name: Research tooling checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-21
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-21
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools
      - run: git diff --check
